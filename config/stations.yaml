# MiniLMS configuration. Works as is; every server setting is optional.
# Reload with SIGHUP (docker kill -s HUP minilms).
server:
  name: MiniLMS
  default_volume: 30   # 0-100, for players MiniLMS has not seen before
  # Optional:
  # ip_address: ...    # address players use for streams; default: the primary interface
  # state_file: ...    # default state.json; the Docker image uses /data/state.json

# Optional per-player names, by player id (MAC). Players that report no
# usable name are named after their model, e.g. "Squeezebox Radio".
# players:
#   "00:04:20:xx:xx:xx":
#     name: Kitchen

# Dutch stations, streams checked on 2026-10-15. These are the stations'
# direct streams, not TuneIn links (those often start with an ad pre-roll). Icons are TuneIn logos; minilms fetches, resizes and caches them.
# The list order is the menu order. preset: 1-6 are the Radio's hardware buttons.
stations:

  # NPO, the national public broadcaster
  - id: npo-radio-1
    name: NPO Radio 1
    url: https://icecast.omroep.nl/radio1-bb-mp3
    icon: https://cdn-radiotime-logos.tunein.com/s17523q.png
